title: 'kiranramanna.github.io'
description: "Thinkit - Research and personal blog on various learnings."
baseurl: "/thinkit"
url: "https://kiranramanna.github.io"
# Example Site settings

# Posts: date-only URLs; categories stay in frontmatter as metadata
# (surfaced via /tags and /search, not woven into the path).
permalink: /:year/:month/:day/:title:output_ext

header_pages:
  - index.md
  - tags.md
  - search.md
  - kiranramanna.md
  - about.md

#footer: 'follow us on <a href="https://twitter.com/">twitter</a>'
style: hacker

footer: 'follow me on <a href="https://www.linkedin.com/in/kiranramanna/">linkedin</a>'
#style: light # dark (default) or light
#listen_for_clients_preferred_style: true # true or false (default)

# docs/ holds design specs, not site content. They quote Liquid in fenced code
# blocks, and anything Jekyll renders will execute that Liquid rather than show
# it — a spec quoting `divided_by: max` failed the Pages build with a division
# by zero, because `max` is only defined inside tags.md. Excluding the folder
# keeps specs readable on GitHub without them becoming templates.
#
# Listing exclude at all replaces Jekyll's defaults, so the standard entries are
# repeated here.
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/
  - Containerfile
  - docker-compose.yml
  - jekyll-theme-console.gemspec
  - LICENSE.txt

plugins:
  - jekyll-seo-tag

# Fonts
# disable_google_fonts: false # set true to prevent loading fonts.googleapis.com

